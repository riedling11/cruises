name: Update storm data

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours, at :23 past
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storms
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch NHC active storms
        run: curl -fsSL --retry 3 --max-time 30 https://www.nhc.noaa.gov/CurrentStorms.json -o /tmp/CurrentStorms.json

      - name: Normalize
        run: python3 scripts/normalize_storms.py /tmp/CurrentStorms.json data/storms.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/storms.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/storms.json
          git commit -m "Update storm data"
          git push
